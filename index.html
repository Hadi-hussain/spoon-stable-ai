<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spoon and Stable | Home</title>
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-overlay: linear-gradient(135deg, rgba(24, 21, 18, 0.92) 0%, rgba(12, 10, 8, 0.96) 100%);
            --card-bg: rgba(28, 25, 23, 0.95);
            --border-gold: rgba(212, 175, 55, 0.3);
            --accent-gold: #d4af37;
            --accent-gold-hover: #b89528;
            --text-light: #f5f2eb;
            --text-muted: #a8a29e;
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-overlay), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=1200') center/cover no-repeat;
            min-height: 100vh;
            color: var(--text-light);
            font-family: var(--font-body);
        }

        /* Hero Text Background Placeholder */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

            .hero h1 {
                font-family: var(--font-heading);
                font-size: 48px;
                letter-spacing: 4px;
                text-transform: uppercase;
                color: var(--accent-gold);
                margin-bottom: 8px;
            }

            .hero p {
                color: var(--text-muted);
                letter-spacing: 2px;
                text-transform: uppercase;
                font-size: 14px;
            }

        /* Floating Trigger Button */
        .chat-widget-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-gold);
            color: #12100e;
            border: none;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: transform 0.25 ease, background-color 0.2s;
        }

            .chat-widget-btn:hover {
                transform: scale(1.08);
                background: var(--accent-gold-hover);
            }

        /* Floating Chat Window */
        .chat-widget-popup {
            position: fixed;
            bottom: 100px;
            right: 28px;
            width: 380px;
            height: 580px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 9998;
            animation: popUp 0.3s ease-out forwards;
        }

        @keyframes popUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-widget-popup.active {
            display: flex;
        }

        .widget-header {
            padding: 18px 20px;
            background: rgba(18, 16, 14, 0.95);
            border-bottom: 1px solid var(--border-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .widget-header h3 {
                font-family: var(--font-heading);
                color: var(--accent-gold);
                font-size: 20px;
                letter-spacing: 1px;
                text-transform: uppercase;
                margin: 0;
            }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .close-btn:hover {
                color: var(--text-light);
            }

        .widget-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 13.5px;
        }

            .widget-body::-webkit-scrollbar {
                width: 4px;
            }

            .widget-body::-webkit-scrollbar-thumb {
                background: rgba(212, 175, 55, 0.2);
                border-radius: 10px;
            }

        .msg {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
            font-weight: 300;
        }

            .msg.bot {
                background: #1c1917;
                border: 1px solid rgba(255, 255, 255, 0.08);
                color: #e7e5e4;
                align-self: flex-start;
                border-bottom-left-radius: 2px;
            }

            .msg.user {
                background: #27221f;
                border: 1px solid var(--border-gold);
                color: var(--text-light);
                align-self: flex-end;
                border-bottom-right-radius: 2px;
            }

        .widget-footer {
            padding: 14px 16px;
            border-top: 1px solid var(--border-gold);
            background: rgba(18, 16, 14, 0.95);
            display: flex;
            gap: 8px;
        }

            .widget-footer input {
                flex: 1;
                background: rgba(12, 10, 8, 0.7);
                border: 1px solid var(--border-gold);
                border-radius: 8px;
                color: var(--text-light);
                padding: 10px 14px;
                font-size: 13px;
                font-family: var(--font-body);
                outline: none;
            }

                .widget-footer input:focus {
                    border-color: var(--accent-gold);
                }

            .widget-footer button {
                background: var(--accent-gold);
                border: none;
                border-radius: 8px;
                padding: 0 14px;
                color: #12100e;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: background-color 0.2s;
            }

                .widget-footer button:hover {
                    background: var(--accent-gold-hover);
                }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Spoon and Stable</h1>
        <p>Minneapolis, Minnesota &bull; Chef Gavin Kaysen</p>
    </div>

    <!-- Floating Widget Trigger Button -->
    <button class="chat-widget-btn" onclick="toggleWidget()">
        <i data-lucide="message-square" style="width: 26px; height: 26px;"></i>
    </button>

    <!-- Floating Chat Window -->
    <div class="chat-widget-popup" id="chat-popup">
        <div class="widget-header">
            <h3>Concierge</h3>
            <button class="close-btn" onclick="toggleWidget()">
                <i data-lucide="x" style="width: 20px; height: 20px;"></i>
            </button>
        </div>

        <div class="widget-body" id="w-body">
            <div class="msg bot">Good evening. Welcome to Spoon and Stable. How may I assist you with reservations, dress code, or menu selections today?</div>
        </div>

        <div class="widget-footer">
            <input type="text" id="w-input" placeholder="Inquire about menu, hours, parking..." onkeypress="if(event.key==='Enter') sendWMessage()">
            <button onclick="sendWMessage()">
                <i data-lucide="send" style="width: 16px; height: 16px;"></i>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let history = [];

        function toggleWidget() {
            const popup = document.getElementById('chat-popup');
            popup.classList.toggle('active');
        }

        async function sendWMessage() {
            const input = document.getElementById('w-input');
            const text = input.value.trim();
            if (!text) return;

            appendMsg('user', text);
            history.push({ role: 'user', content: text });
            input.value = '';

            try {
                const res = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: history })
                });
                const data = await res.json();
                appendMsg('bot', data.bot_response);
                history.push({ role: 'assistant', content: data.bot_response });
            } catch (e) {
                appendMsg('bot', '⚠️ Connection error. Please ensure the server is active.');
            }
        }

        function appendMsg(sender, text) {
            const body = document.getElementById('w-body');
            const d = document.createElement('div');
            d.className = `msg ${sender}`;
            d.innerText = text;
            body.appendChild(d);
            body.scrollTop = body.scrollHeight;
        }
    </script>

</body>
</html>
